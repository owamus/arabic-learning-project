  </g>
  <g fill="#fff">
    <rect x="10" y="10" width="18" height="13" rx="4"/>
    <rect x="32" y="10" width="22" height="13" rx="4"/>
    <rect x="10" y="28" width="12" height="13" rx="4"/>
    <rect x="26" y="28" width="16" height="13" rx="4"/>
    <rect x="46" y="28" width="8" height="13" rx="4" fill="#10b981"/>
