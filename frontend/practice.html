<!doctype html>
<html>
  <head>
    <title>Arabic Practice</title>
    <link rel="stylesheet" href="script.css" />
  </head>
  <style>
    body {
      background-color: rgb(0, 0, 0);
    }
  </style>
  <body>
    <p id="arabic-hint">
      Hover over an Arabic word and add it to your weak words list.
    </p>
    <div class="arabic">
      <h1 id="sentence">Loading...</h1>
    </div>

    <div class="beneath-arabic">
      <button id="grammar-btn" class="grammar-btn" disabled>Show grammar</button>
      <div id="grammar-legend" hidden></div>
    </div>
    <div class="top-div">
      <div class="sentence-builder-space">
        <p class="title-sentence-space">Your sentence</p>
        <p class="description-sentence">
          Tap words below, in order, to build the sentence here.
        </p>
      </div>
    </div>

    <p id="level-label"></p>
    <p id="result"></p>

    <div class="centered-div"></div>

    <div>
      <button class="skip-btn" ; id="skip">skip</button>
    </div>

    <div>
      <p id="feedback" aria-live="polite"></p>
      <p id="mistake-detail" aria-live="polite" hidden></p>
      <div id="gif-box" hidden>
        <img id="gif-img" alt="" />
        <p class="gif-credit">Powered by GIPHY</p>
      </div>
      <p id="correct-answer" aria-live="polite" hidden></p>
    </div>

    <div id="confidence-panel" hidden></div>

    <button class="submitBtn">Submit</button>
    <div class="nav-links">
      <a class="weak-link" href="index.html">← Home</a>
      <a class="weak-link" href="weak.html">Review my weak words</a>
      <button class="weak-link" id="gif-btn">GIFs: on</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
